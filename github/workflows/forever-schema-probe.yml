name: Forever schema probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout optimizer
        uses: actions/checkout@v4
      - name: Checkout QuestieDB
        uses: actions/checkout@v4
        with:
          repository: Questie/QuestieDB
          ref: 5c094f6e9a264f0dc54e2fde9731a37a97ed197c
          path: vendor/QuestieDB
          persist-credentials: false
      - name: Inspect Forever schema and sources
        run: python3 scripts/schema_probe.py
      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forever-schema-probe
          path: reports/forever-schema-probe.json
          if-no-files-found: error
          retention-days: 14
