name: Forever Semantics and Localization Audit v2.6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Questie/QuestieDB
          ref: 5c094f6e9a264f0dc54e2fde9731a37a97ed197c
          path: vendor/QuestieDB
          persist-credentials: false
      - name: Inspect quest semantics and localization sources
        run: python3 scripts/audit_semantics_locale_v26.py
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forever-semantics-locale-v26
          path: reports/forever-semantics-locale-v26.json
          if-no-files-found: error
          retention-days: 14
