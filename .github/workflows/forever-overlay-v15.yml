name: Forever Correction Overlay v1.5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Questie/QuestieDB
          ref: 5c094f6e9a264f0dc54e2fde9731a37a97ed197c
          path: vendor/QuestieDB
          persist-credentials: false
      - name: Run v1.5 tests
        run: python3 -m unittest discover -s tests -p 'test_overlay_v15.py' -v
      - name: Import raw Forever quests
        run: python3 scripts/import_quests.py
      - name: Build evidence-only correction overlay
        run: python3 scripts/build_correction_overlay_v15.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forever-overlay-v15
          path: reports/forever-overlay-v15.json
          if-no-files-found: warn
          retention-days: 14
