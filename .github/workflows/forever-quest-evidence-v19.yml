name: Forever Quest Evidence v1.9
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quest-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Questie/QuestieDB
          ref: 5c094f6e9a264f0dc54e2fde9731a37a97ed197c
          path: vendor/QuestieDB
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          lua5.1 -v
      - name: Native test and quest evidence
        run: python3 scripts/export_forever_v19.py
      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forever-quest-evidence-v19
          path: |
            reports/forever-quest-evidence-v19.json
            reports/forever-native-v19.log
          if-no-files-found: warn
          retention-days: 14
