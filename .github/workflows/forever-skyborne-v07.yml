name: Forever Skyborne v0.7
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout optimizer
        uses: actions/checkout@v4
      - name: Checkout pinned QuestieDB
        uses: actions/checkout@v4
        with:
          repository: Questie/QuestieDB
          ref: 5c094f6e9a264f0dc54e2fde9731a37a97ed197c
          path: vendor/QuestieDB
          persist-credentials: false
      - name: Test Skyborne discovery
        run: python3 -m unittest discover -s tests -p 'test_skyborne_v07.py' -v
      - name: Import Forever quests
        run: python3 scripts/import_quests.py
      - name: Inspect Skyborne evidence
        run: python3 scripts/inspect_skyborne.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forever-skyborne-v07
          path: |
            reports/forever-skyborne-v07.json
            reports/forever-import-report.json
          if-no-files-found: warn
          retention-days: 14
