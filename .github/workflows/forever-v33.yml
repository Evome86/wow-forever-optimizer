name: Forever v3.3 Addon Semantics and Test Chains
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Questie/QuestieDB
          ref: 5c094f6e9a264f0dc54e2fde9731a37a97ed197c
          path: vendor/QuestieDB
          persist-credentials: false
      - name: Checkout Questie addon runtime source
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Questie/Questie
          path: vendor/Questie
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Export native Forever quests
        run: python3 scripts/run_native_quest_export_v23.py
      - name: Inspect both repositories and select test chains
        run: python3 scripts/audit_runtime_v33.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forever-v33-semantics-and-chains
          path: |
            reports/forever-v33-source-and-chains.json
            reports/forever-native-export-v23-report.json
            reports/forever-native-quests-v23.log
          if-no-files-found: warn
          retention-days: 14
