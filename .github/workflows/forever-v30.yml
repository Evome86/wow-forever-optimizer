name: Forever v3.0 Bilingual and Semantics Triage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Questie/QuestieDB
          ref: 5c094f6e9a264f0dc54e2fde9731a37a97ed197c
          path: vendor/QuestieDB
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_localization_v29.py' -v
          python3 -m unittest discover -s tests -p 'test_v30.py' -v
      - name: Native export
        run: python3 scripts/run_native_quest_export_v23.py
      - name: Bilingual dataset and semantics triage
        run: python3 scripts/build_v30.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forever-v30
          path: |
            reports/forever-v30-diagnostics.json
            reports/forever-v30-bilingual-quests.json
            reports/forever-native-export-v23-report.json
            reports/forever-native-quests-v23.log
          if-no-files-found: warn
          retention-days: 14
