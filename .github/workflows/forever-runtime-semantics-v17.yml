name: Forever Runtime Semantics v1.7
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Questie/QuestieDB
          ref: 5c094f6e9a264f0dc54e2fde9731a37a97ed197c
          path: vendor/QuestieDB
          persist-credentials: false
      - name: Test v1.7
        run: python3 -m unittest discover -s tests -p 'test_runtime_semantics_v17.py' -v
      - name: Build focused runtime source evidence
        run: python3 scripts/audit_runtime_semantics_v17.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forever-runtime-semantics-v17
          path: reports/forever-runtime-semantics-v17.json
          if-no-files-found: warn
          retention-days: 14
