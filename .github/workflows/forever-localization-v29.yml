name: Forever Localization Parser Fix v2.9
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  localization:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Questie/QuestieDB
          ref: 5c094f6e9a264f0dc54e2fde9731a37a97ed197c
          path: vendor/QuestieDB
          persist-credentials: false
      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - name: Test German parser
        run: python3 -m unittest discover -s tests -p 'test_localization_v29.py' -v
      - name: Export native quest data
        run: python3 scripts/run_native_quest_export_v23.py
      - name: Match German names by quest ID
        run: python3 scripts/audit_localization_v29.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forever-localization-v29
          path: |
            reports/forever-localization-v29.json
            reports/forever-quest-names-v29.csv
            reports/forever-native-export-v23-report.json
            reports/forever-native-quests-v23.log
          if-no-files-found: warn
          retention-days: 14
