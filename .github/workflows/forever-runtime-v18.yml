name: Forever Native Runtime Validation v1.8
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Questie/QuestieDB
          ref: 5c094f6e9a264f0dc54e2fde9731a37a97ed197c
          path: vendor/QuestieDB
          persist-credentials: false
      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          lua -v
      - name: Run upstream native runtime tests
        run: python3 scripts/run_runtime_v18.py
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forever-native-runtime-v18
          path: |
            reports/forever-runtime-v18.json
            reports/forever-runtime-v18.log
          if-no-files-found: warn
          retention-days: 14
