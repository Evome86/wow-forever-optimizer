name: Forever Skyborne v0.8
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  filter:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout optimizer
        uses: actions/checkout@v4
      - name: Checkout pinned QuestieDB
        uses: actions/checkout@v4
        with:
          repository: Questie/QuestieDB
          ref: 5c094f6e9a264f0dc54e2fde9731a37a97ed197c
          path: vendor/QuestieDB
          persist-credentials: false
      - name: Test Skyborne candidate filter
        run: python3 -m unittest discover -s tests -p 'test_skyborne_v08.py' -v
      - name: Import Forever quests
        run: python3 scripts/import_quests.py
      - name: Build Skyborne candidate report
        run: python3 scripts/filter_skyborne_v08.py
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forever-skyborne-v08
          path: |
            reports/forever-skyborne-v08.json
            reports/forever-import-report.json
          if-no-files-found: warn
          retention-days: 14
